<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音效相关 - 访问验证 | ⚡ 我的工作站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .logo h1 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .logo p {
            color: #888;
            font-size: 0.9rem;
        }

        .section-badge {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .password-input-wrap {
            position: relative;
        }

        .password-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .password-input.error {
            border-color: #e74c3c;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 5px;
            font-size: 1.1rem;
        }

        .toggle-password:hover {
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #667eea;
        }

        .hint-box {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 20px;
        }

        .hint-box p {
            color: #ffc107;
            font-size: 0.85rem;
            margin: 0;
        }

        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 成功动画 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .success-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            text-align: center;
            color: #fff;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🔊</div>
            <h1>音效相关</h1>
            <p>Sound Effects Resources</p>
        </div>

        <div style="text-align: center;">
            <span class="section-badge">🔒 受保护内容</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">访问密码</label>
                <div class="password-input-wrap">
                    <input 
                        type="password" 
                        id="password" 
                        class="password-input" 
                        placeholder="请输入密码"
                        autocomplete="off"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                进入音效中心
            </button>

            <div class="error-message" id="errorMessage">
                ❌ 密码错误，请重试
            </div>
        </form>

        <div class="hint-box">
            <p>💡 提示：默认密码为 <strong>661139</strong>（可在页面源码中修改）</p>
        </div>

        <div class="back-link">
            <a href="index.html">← 返回工作站首页</a>
        </div>
    </div>

    <!-- 成功动画 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <h2>验证成功</h2>
            <p>正在进入音效中心...</p>
        </div>
    </div>

    <script>
        // 密码配置（可在此修改密码）
        const CONFIG = {
            password: '661139',  // 修改这里的密码
            redirectUrl: 'sound-effects-hub.html',  // 验证成功后跳转的页面
            sessionKey: 'sfx_access_granted',
            sessionDuration: 24 * 60 * 60 * 1000  // 24小时有效期
        };

        // 检查是否已有有效会话
        function checkExistingSession() {
            const session = localStorage.getItem(CONFIG.sessionKey);
            if (session) {
                const data = JSON.parse(session);
                if (Date.now() - data.timestamp < CONFIG.sessionDuration) {
                    // 会话有效，直接跳转
                    window.location.href = CONFIG.redirectUrl;
                    return true;
                } else {
                    // 会话过期，清除
                    localStorage.removeItem(CONFIG.sessionKey);
                }
            }
            return false;
        }

        // 页面加载时检查会话
        if (checkExistingSession()) {
            // 如果已登录，会在上面直接跳转
        }

        // 切换密码显示/隐藏
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // 表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const input = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMessage');
            const password = input.value.trim();

            // 禁用按钮显示加载
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>验证中...';
            errorMsg.classList.remove('show');
            input.classList.remove('error');

            // 模拟验证延迟（增加仪式感）
            setTimeout(() => {
                if (password === CONFIG.password) {
                    // 验证成功
                    
                    // 创建会话
                    localStorage.setItem(CONFIG.sessionKey, JSON.stringify({
                        timestamp: Date.now(),
                        authenticated: true
                    }));

                    // 显示成功动画
                    document.getElementById('successOverlay').classList.add('show');

                    // 跳转
                    setTimeout(() => {
                        window.location.href = CONFIG.redirectUrl;
                    }, 1500);
                } else {
                    // 验证失败
                    input.classList.add('error');
                    errorMsg.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '进入音效中心';
                    
                    // 清空密码框
                    input.value = '';
                    input.focus();
                }
            }, 600);
        });

        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
