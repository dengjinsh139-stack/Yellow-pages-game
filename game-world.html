<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏世界 | ⚡ 我的工作站</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-card-hover: #222230;
            --primary: #00d4aa;
            --primary-dark: #00a884;
            --secondary: #7c3aed;
            --accent-orange: #ff9800;
            --accent-red: #f44336;
            --accent-blue: #2196f3;
            --accent-purple: #9c27b0;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 导航栏 */
        .top-nav {
            background: rgba(15, 15, 23, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .nav-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--primary);
            background: rgba(0, 212, 170, 0.1);
        }

        /* 头部区域 */
        .header-section {
            text-align: center;
            padding: 60px 24px 40px;
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.1) 0%, transparent 100%);
        }

        .header-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header-title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 游戏类型标签 */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 24px 40px;
            flex-wrap: wrap;
        }

        .category-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-tab:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .category-tab.active {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.15) 0%, rgba(124, 58, 237, 0.15) 100%);
            border-color: var(--primary);
            color: var(--primary);
        }

        .category-tab .icon {
            font-size: 1.3rem;
        }

        /* 主内容区 */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        /* 游戏大类卡片 */
        .category-section {
            margin-bottom: 60px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .category-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .category-info h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .category-info p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* 子分类网格 */
        .subcategory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
        }

        /* 子分类卡片 */
        .subcategory-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .subcategory-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(0, 212, 170, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .subcategory-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .subcategory-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subcategory-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 游戏列表 */
        .games-list {
            padding: 16px;
        }

        .game-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .game-item:last-child {
            margin-bottom: 0;
        }

        .game-item:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .game-title-group h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .game-title-group .game-en {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .game-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .game-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .game-link:hover {
            background: rgba(0, 212, 170, 0.15);
            color: var(--primary);
        }

        .game-link.dev:hover {
            background: rgba(124, 58, 237, 0.15);
            color: var(--secondary);
        }

        .game-link.ost:hover {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
        }

        /* 底部 */
        .footer-info {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header-title {
                font-size: 2rem;
            }

            .subcategory-grid {
                grid-template-columns: 1fr;
            }

            .category-tabs {
                padding: 0 16px 24px;
            }

            .category-tab {
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            .nav-links {
                display: none;
            }
        }

        /* 加载动画 */
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="top-nav">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-icon">⚡</div>
                <span>我的工作站 <span class="nav-version" data-version>v2.6.0</span></span>
            </a>
            <div class="nav-links" id="nav-links"></div>
        </div>
    </nav>

    <!-- 头部 -->
    <header class="header-section fade-in">
        <div class="header-icon">🎮</div>
        <h1 class="header-title">Game World · 游戏世界</h1>
        <p class="header-subtitle">探索游戏类型的无限可能 · 从RPG到FPS · 发现经典与创新之作</p>
    </header>

    <!-- 游戏类型标签 -->
    <nav class="category-tabs fade-in" id="categoryTabs">
        <!-- 动态生成 -->
    </nav>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent">
        <!-- 动态生成游戏分类内容 -->
    </main>

    <!-- 底部 -->
    <footer class="footer-info">
        <p>⚡ 我的工作站 <span data-version>v2.6.0</span> | 游戏世界</p>
        <p>© 2026 个人游戏开发实验室 🎮</p>
    </footer>

    <!-- 数据文件 -->
    <script src="data/game-world-data.js"></script>
    <!-- 导航配置 -->
    <script src="nav-config.js"></script>
    
    <script>
        // 渲染游戏类型标签
        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            let html = '';
            
            GAME_WORLD_DATA.categories.forEach((category, index) => {
                const activeClass = index === 0 ? 'active' : '';
                html += `
                    <button class="category-tab ${activeClass}" onclick="scrollToCategory('${category.id}')">
                        <span class="icon">${category.icon}</span>
                        <span>${category.name}</span>
                    </button>
                `;
            });
            
            tabsContainer.innerHTML = html;
        }

        // 渲染游戏内容
        function renderGameContent() {
            const mainContent = document.getElementById('mainContent');
            let html = '';
            
            GAME_WORLD_DATA.categories.forEach(category => {
                html += `
                    <section class="category-section fade-in" id="${category.id}">
                        <div class="category-header">
                            <div class="category-icon" style="background: linear-gradient(135deg, ${category.color}20 0%, ${category.color}05 100%); box-shadow: 0 4px 20px ${category.color}30;">
                                ${category.icon}
                            </div>
                            <div class="category-info">
                                <h2 style="color: ${category.color}">${category.name}</h2>
                                <p>${category.description}</p>
                            </div>
                        </div>
                        
                        <div class="subcategory-grid">
                            ${category.subCategories.map(sub => `
                                <article class="subcategory-card">
                                    <div class="subcategory-header">
                                        <h3>${sub.name} · ${sub.nameCn}</h3>
                                        <p>${sub.description}</p>
                                    </div>
                                    <div class="games-list">
                                        ${sub.games.map(game => `
                                            <div class="game-item">
                                                <div class="game-header">
                                                    <div class="game-title-group">
                                                        <h4>${game.name}</h4>
                                                        <span class="game-en">${game.nameEn}</span>
                                                    </div>
                                                </div>
                                                <div class="game-links">
                                                    <a href="${game.developerUrl}" target="_blank" class="game-link dev">
                                                        🏢 ${game.developer}
                                                    </a>
                                                    <a href="${game.gameplayUrl}" target="_blank" class="game-link">
                                                        🎬 实况
                                                    </a>
                                                    <a href="${game.cgUrl}" target="_blank" class="game-link" style="background: rgba(233, 30, 99, 0.15); color: #e91e63;">
                                                        🎬 首曝CG
                                                    </a>
                                                    <a href="${game.ostUrl}" target="_blank" class="game-link ost">
                                                        🎵 OST
                                                    </a>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </article>
                            `).join('')}
                        </div>
                    </section>
                `;
            });
            
            mainContent.innerHTML = html;
        }

        // 滚动到指定分类
        function scrollToCategory(categoryId) {
            // 更新标签状态
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.category-tab').classList.add('active');
            
            // 滚动到对应区域
            const element = document.getElementById(categoryId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initVersion();
            initNav();
            renderCategoryTabs();
            renderGameContent();
        });
    </script>
</body>
</html>
