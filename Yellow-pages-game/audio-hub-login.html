<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频应用中心 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .login-container {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00d4aa 0%, #7c3aed 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #fff;
        }

        p {
            color: #888;
            margin-bottom: 32px;
        }

        .password-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            border-color: #00d4aa;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4aa 0%, #00a884 100%);
            border: none;
            border-radius: 12px;
            color: #0a0a0f;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3);
        }

        .error-msg {
            color: #ff4444;
            margin-top: 16px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #00d4aa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">🎵</div>
        <h1>音频应用中心</h1>
        <p>请输入访问密码</p>
        
        <input type="password" class="password-input" id="password" placeholder="输入密码..." >
        <button class="login-btn" onclick="login()">进入系统</button>
        <p class="error-msg" id="errorMsg">密码错误，请重试</p>
        
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <script>
        function login() {
            const password = document.getElementById('password').value;
            const correctPassword = 'audio2024'; // 音频中心密码
            
            if (password === correctPassword) {
                localStorage.setItem('audio_hub_access_granted', JSON.stringify({
                    timestamp: Date.now()
                }));
                window.location.href = 'audio-hub.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
  <script src="assets/js/music-global.js?v=2.8.9"></script>
</body>
</html>
