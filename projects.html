<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 项目 - 我的工作站</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00d4aa;
            --primary-blue: #00a8e8;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
            --text-muted: #888;
        }
        
        body {
            font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        
        /* 顶部导航 */
        .top-nav {
            background: rgba(15, 15, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .nav-logo-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-version {
            font-size: 0.7rem;
            color: var(--primary);
            background: rgba(0, 212, 170, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 212, 170, 0.2);
            font-weight: 500;
        }

        .nav-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-blue) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-links { display: flex; gap: 8px; }

        .nav-link {
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 212, 170, 0.1);
            color: var(--primary);
        }
        
        /* 页面头部 */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(180deg, rgba(0, 212, 170, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }
        
        .main-title {
            font-family: 'Black Ops One', 'Noto Sans SC', sans-serif;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 15px;
            letter-spacing: 3px;
        }
        
        /* 子导航 */
        .sub-nav {
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            position: sticky;
            top: 61px;
            z-index: 999;
        }
        
        .sub-nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .sub-nav-link {
            padding: 10px 25px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        
        .sub-nav-link:hover, .sub-nav-link.active {
            background: rgba(0, 212, 170, 0.1);
            color: var(--primary);
            border-color: rgba(0, 212, 170, 0.3);
        }
        
        /* 内容区域 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .section-title h2 {
            font-size: 2rem;
            color: var(--primary);
            letter-spacing: 2px;
        }
        
        /* 项目卡片 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s;
        }
        
        .project-card:hover {
            border-color: rgba(0, 212, 170, 0.3);
            transform: translateY(-5px);
        }
        
        .project-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .project-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-blue) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .project-title {
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
        }
        
        .project-status {
            padding: 4px 12px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--primary);
            margin-left: auto;
        }
        
        .project-desc {
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        .project-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .meta-item span {
            color: var(--primary);
        }
        
        /* 占位内容 */
        .placeholder-box {
            background: var(--bg-card);
            border: 2px dashed rgba(0, 212, 170, 0.3);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
        }
        
        .placeholder-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .placeholder-text {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        /* G42 录音管理表格样式 */
        .g42-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .g42-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .g42-header h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .g42-header p {
            color: var(--text-muted);
        }
        
        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-box .number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-box .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        
        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-group label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .filter-group select,
        .filter-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.9rem;
            min-width: 120px;
        }
        
        .filter-group input {
            min-width: 200px;
        }
        
        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 表格样式 */
        .data-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            background: rgba(0, 212, 170, 0.1);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-size: 0.9rem;
        }
        
        .data-table tbody tr:hover {
            background: rgba(0, 212, 170, 0.05);
        }
        
        .data-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        /* 角色列 */
        .char-name {
            font-weight: 600;
            color: #fff;
        }
        
        .char-actor {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        /* 批次标签 */
        .batch-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .batch-1 { background: rgba(0, 212, 170, 0.15); color: var(--primary); }
        .batch-2 { background: rgba(0, 168, 232, 0.15); color: var(--primary-blue); }
        .batch-3 { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .batch-2-5 { background: rgba(156, 39, 176, 0.15); color: #9c27b0; }
        
        /* 类型标签 */
        .type-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }
        
        /* 状态标签 */
        .status-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .status-done { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
        .status-pending { background: rgba(255, 152, 0, 0.15); color: #ff9800; }
        .status-recording { background: rgba(0, 212, 170, 0.15); color: var(--primary); }
        
        /* 台词内容 */
        .line-text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        
        .pagination button {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: rgba(0, 212, 170, 0.2);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .main-title { font-size: 2rem; }
            .sub-nav-link { padding: 8px 15px; font-size: 0.85rem; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            { id: 25, character: '张辽', actor: '待定', batch: '第三批', type: '功能性语音', scene: '界面交互', text: ' assassin 出生的我，不会轻易倒下。', status: '待录制', fileName: '' }
        ];

        let filteredData = [...voiceData];
        let currentPage = 1;
        const itemsPerPage = 10;

        // 计算统计数据
        function updateStats() {
            const uniqueChars = new Set(voiceData.map(d => d.character)).size;
            const totalLines = voiceData.length;
            const recordedLines = voiceData.filter(d => d.status === '已录完').length;
            const progress = Math.round((recordedLines / totalLines) * 100);

            document.getElementById('stat-characters').textContent = uniqueChars;
            document.getElementById('stat-lines').textContent = totalLines;
            document.getElementById('stat-recorded').textContent = recordedLines;
            document.getElementById('stat-progress').textContent = progress + '%';
        }

        // 获取批次样式类
        function getBatchClass(batch) {
            const map = { '第一批': 'batch-1', '第二批': 'batch-2', '第三批': 'batch-3', '第2.5批': 'batch-2-5' };
            return map[batch] || 'batch-1';
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const map = { '已录完': 'status-done', '待录制': 'status-pending', '重录': 'status-recording' };
            return map[status] || 'status-pending';
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('table-body');
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            // 更新分页信息
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages || 1;
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;

            // 空状态
            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="icon">🔍</div>
                            <div>没有找到匹配的数据</div>
                        </td>
                    </tr>
                `;
                return;
            }

            // 分页数据
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = filteredData.slice(start, start + itemsPerPage);

            tbody.innerHTML = pageData.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>
                        <div class="char-name">${item.character}</div>
                        <div class="char-actor">${item.actor}</div>
                    </td>
                    <td><span class="batch-tag ${getBatchClass(item.batch)}">${item.batch}</span></td>
                    <td><span class="type-tag">${item.type}</span></td>
                    <td>${item.scene || '-'}</td>
                    <td><div class="line-text" title="${item.text}">${item.text}</div></td>
                    <td><span class="status-tag ${getStatusClass(item.status)}">${item.status}</span></td>
                    <td>${item.fileName || '-'}</td>
                </tr>
            `).join('');
        }

        // 筛选功能
        function filterTable() {
            const batch = document.getElementById('filter-batch').value;
            const type = document.getElementById('filter-type').value;
            const status = document.getElementById('filter-status').value;
            const search = document.getElementById('filter-search').value.toLowerCase();

            filteredData = voiceData.filter(item => {
                const matchBatch = !batch || item.batch === batch;
                const matchType = !type || item.type.includes(type);
                const matchStatus = !status || item.status === status;
                const matchSearch = !search || 
                    item.character.toLowerCase().includes(search) ||
                    item.text.toLowerCase().includes(search) ||
                    item.actor.toLowerCase().includes(search) ||
                    item.fileName.toLowerCase().includes(search);
                
                return matchBatch && matchType && matchStatus && matchSearch;
            });

            currentPage = 1;
            renderTable();
        }

        // 分页功能
        function changePage(delta) {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }

        // 初始化
        function showSection(sectionId, linkElement) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
            
            document.querySelectorAll('.sub-nav-link').forEach(link => {
                link.classList.remove('active');
            });
            if (linkElement) {
                linkElement.classList.add('active');
            }

            // 如果是 G42 页面，初始化数据
            if (sectionId === 'g42') {
                updateStats();
                renderTable();
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderTable();
        });
    </script>
